<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Límites de temperatura</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body>
        <div class="config-container">
            <div class="config-card">
                <h2>Configurar límites de temperatura</h2>
                <form method="POST" class="config-form">
                    <label>Temperatura mínima (°C)</label>
                    <input type="number" step="0.1" name="min_temp" value="{{ min_temp }}">
                    <label>Temperatura máxima (°C)</label>
                    <input type="number" step="0.1" name="max_temp" value="{{ max_temp }}">
                    <button class="config-button">
                        Guardar límites
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
